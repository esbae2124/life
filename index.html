<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인터랙티브 인생 그래프</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js 및 Annotation 플러그인 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <style>
        /* 캔버스 드래그 방지 및 커서 설정 */
        canvas {
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }
        /* 삭제 버튼 위치 보정 */
        .delete-btn {
            transform: translate(-50%, -100%);
            margin-top: -10px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans text-slate-800">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-100">
        <!-- 헤더 영역 -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-3xl font-bold mb-2">나의 인생 그래프</h1>
            <p class="text-blue-100 font-medium">빈 공간을 클릭하여 점을 추가하고, 기존 점을 클릭하여 삭제하세요.</p>
        </div>

        <div class="p-6">
            <!-- 상단 안내 및 도구 버튼 -->
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-3 text-sm text-slate-600">
                    <span class="flex items-center gap-1"><span class="w-3 h-3 bg-blue-500 rounded-full inline-block"></span> 십자선을 보고 클릭하여 추가</span>
                    <span class="flex items-center gap-1 ml-2"><span class="w-3 h-3 bg-red-500 rounded-full inline-block"></span> 점 클릭하여 삭제</span>
                </div>
                <button onclick="clearAll()" class="text-sm px-4 py-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 transition-colors font-semibold">
                    모두 지우기
                </button>
            </div>

            <!-- 그래프 영역 -->
            <div id="chart-wrapper" class="relative w-full h-[550px] border border-slate-200 rounded-xl bg-slate-50/30">
                <canvas id="lifeChart"></canvas>
                
                <!-- 플로팅 삭제 버튼 (숨김 상태로 대기) -->
                <button id="deleteBtn" class="hidden absolute bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg hover:bg-red-600 hover:scale-110 transition-all z-10 delete-btn text-base font-bold" aria-label="삭제">
                    ✕
                </button>
            </div>
        </div>
    </div>

    <!-- 데이터 입력 모달 팝업 -->
    <div id="inputModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 opacity-0 transition-opacity duration-200">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-[90%] max-w-sm transform scale-95 transition-transform duration-200" id="modalContent">
            <h3 class="font-bold text-xl mb-1 text-slate-800">사건 기록하기</h3>
            <p id="modalCoords" class="text-sm text-blue-600 font-semibold mb-4 bg-blue-50 inline-block px-2 py-1 rounded"></p>
            
            <div class="mb-5">
                <label for="eventInput" class="block text-sm font-medium text-slate-600 mb-1">어떤 일이 있었나요?</label>
                <input type="text" id="eventInput" class="w-full border border-slate-300 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow" placeholder="예: 첫 취업, 세계 여행 등" autocomplete="off">
            </div>
            
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition-colors font-medium">취소</button>
                <button onclick="saveDataPoint()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium shadow-sm">추가하기</button>
            </div>
        </div>
    </div>

    <script>
        // 전역 상태 변수
        let rawData = []; // 데이터 구조: { x: 나이, y: 점수, event: 사건이름 }
        let chartInstance = null;
        let selectedIndexForDelete = -1;
        let pendingPoint = { x: 0, y: 0 };

        // DOM 요소 캐싱
        const deleteBtn = document.getElementById('deleteBtn');
        const inputModal = document.getElementById('inputModal');
        const modalContent = document.getElementById('modalContent');
        const eventInput = document.getElementById('eventInput');
        const modalCoords = document.getElementById('modalCoords');

        // 십자선(Crosshair) 및 좌표축 라벨을 그리는 커스텀 Chart.js 플러그인
        const crosshairPlugin = {
            id: 'crosshair',
            // 마우스 이동 시 좌표 추적
            afterEvent(chart, args) {
                const { type, x, y } = args.event;
                if (type === 'mousemove') {
                    chart.crosshair = { x, y };
                    args.changed = true; // 차트 다시 그리기 유도
                } else if (type === 'mouseout') {
                    chart.crosshair = null;
                    args.changed = true;
                }
            },
            // 차트 렌더링 후 점선과 라벨을 최상단에 그리기
            afterDraw(chart) {
                if (!chart.crosshair) return;
                
                const { ctx, chartArea, scales: { x, y } } = chart;
                const { x: mouseX, y: mouseY } = chart.crosshair;
                
                // 마우스가 차트 데이터 영역 안에 있을 때만 그리기
                if (mouseX < chartArea.left || mouseX > chartArea.right || mouseY < chartArea.top || mouseY > chartArea.bottom) {
                    return;
                }

                ctx.save();
                
                // 1. 십자 점선 그리기
                ctx.beginPath();
                ctx.setLineDash([5, 5]); // 점선 패턴
                ctx.strokeStyle = 'rgba(100, 116, 139, 0.6)'; // slate-500 색상
                ctx.lineWidth = 1.5;
                
                // 세로선
                ctx.moveTo(mouseX, chartArea.top);
                ctx.lineTo(mouseX, chartArea.bottom);
                // 가로선
                ctx.moveTo(chartArea.left, mouseY);
                ctx.lineTo(chartArea.right, mouseY);
                ctx.stroke();

                // 2. 픽셀 좌표를 실제 데이터 값으로 변환
                // 나이는 정수, 점수는 소수점 첫째자리까지 표시
                let valX = Math.round(x.getValueForPixel(mouseX));
                let valY = y.getValueForPixel(mouseY).toFixed(1);

                // 값 범위 제한 (시각적 일관성)
                valX = Math.max(0, valX); 
                valY = Math.max(-10, Math.min(10, parseFloat(valY))).toFixed(1);

                ctx.setLineDash([]); // 점선 초기화

                // 3. X축 (나이) 하단 라벨 박스 그리기
                const textX = `${valX}살`;
                ctx.fillStyle = 'rgba(30, 41, 59, 0.9)'; // 짙은 배경
                const xLabelWidth = 50;
                const xLabelHeight = 24;
                ctx.fillRect(mouseX - (xLabelWidth / 2), chartArea.bottom, xLabelWidth, xLabelHeight);
                
                ctx.fillStyle = 'white';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(textX, mouseX, chartArea.bottom + (xLabelHeight / 2));

                // 4. Y축 (점수) 좌측 라벨 박스 그리기
                const textY = `${valY}점`;
                const yLabelWidth = 55;
                const yLabelHeight = 24;
                ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
                ctx.fillRect(chartArea.left - yLabelWidth, mouseY - (yLabelHeight / 2), yLabelWidth, yLabelHeight);
                
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.fillText(textY, chartArea.left - (yLabelWidth / 2), mouseY);

                ctx.restore();
            }
        };

        function initChart() {
            const ctx = document.getElementById('lifeChart').getContext('2d');
            
            chartInstance = new Chart(ctx, {
                type: 'scatter', 
                plugins: [crosshairPlugin], // 커스텀 플러그인 등록
                data: {
                    datasets: [{
                        label: '인생 흐름',
                        data: rawData,
                        showLine: true, 
                        borderColor: '#2563eb', 
                        backgroundColor: 'rgba(37, 99, 235, 0.15)',
                        borderWidth: 3,
                        pointRadius: 6,
                        pointHoverRadius: 9,
                        pointBackgroundColor: '#2563eb',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        tension: 0.3, 
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    onClick: handleChartClick,
                    // 마우스 이벤트 활성화 (크로스헤어를 위해 필요)
                    events: ['mousemove', 'mouseout', 'click', 'touchstart', 'touchmove'],
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }, // 커스텀 글상자를 사용하므로 툴팁 비활성화
                        annotation: { annotations: {} }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            min: 0,
                            max: 100, // 기본 최대 나이 100세
                            title: { display: true, text: '나이 (세)', font: { weight: 'bold', size: 14 }, color: '#475569' },
                            grid: { color: 'rgba(0,0,0,0.03)' }
                        },
                        y: {
                            min: -10,
                            max: 10,
                            title: { display: true, text: '행복도 / 성취도', font: { weight: 'bold', size: 14 }, color: '#475569' },
                            grid: { color: 'rgba(0,0,0,0.06)' }
                        }
                    },
                    animation: {
                        duration: 300 // 부드러운 차트 업데이트
                    }
                }
            });
        }

        function handleChartClick(event, elements, chart) {
            // 1. 기존 점을 클릭한 경우 (삭제 모드 진입)
            if (elements.length > 0) {
                const element = elements[0];
                selectedIndexForDelete = element.index;
                
                // 클릭된 점의 픽셀 좌표 가져와서 버튼 띄우기
                const meta = chart.getDatasetMeta(element.datasetIndex);
                const pointInfo = meta.data[element.index];
                
                deleteBtn.style.left = pointInfo.x + 'px';
                deleteBtn.style.top = pointInfo.y + 'px';
                deleteBtn.classList.remove('hidden');
                return;
            }

            // 빈 공간 클릭 시 기존 삭제버튼 숨김
            hideDeleteBtn();

            // 2. 빈 배경을 클릭한 경우 (추가 모드 진입)
            const canvasPosition = Chart.helpers.getRelativePosition(event, chart);
            let dataX = chart.scales.x.getValueForPixel(canvasPosition.x);
            let dataY = chart.scales.y.getValueForPixel(canvasPosition.y);

            // 추가할 때는 깔끔하게 정수로 반올림
            dataX = Math.round(dataX);
            dataY = Math.round(dataY);
            dataX = Math.max(0, Math.min(100, dataX)); 
            dataY = Math.max(-10, Math.min(10, dataY)); 

            // 모달 열기
            pendingPoint = { x: dataX, y: dataY };
            openModal(dataX, dataY);
        }

        function openModal(x, y) {
            modalCoords.innerText = `나이: ${x}세 | 행복도: ${y}점`;
            eventInput.value = '';
            
            inputModal.classList.remove('hidden');
            setTimeout(() => {
                inputModal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
            
            eventInput.focus();
        }

        function closeModal() {
            inputModal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                inputModal.classList.add('hidden');
            }, 200);
        }

        // 엔터키 입력 지원
        eventInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') saveDataPoint();
        });

        // 새로운 데이터 저장
        function saveDataPoint() {
            const eventText = eventInput.value.trim();
            if (!eventText) {
                eventInput.classList.add('ring-2', 'ring-red-400');
                setTimeout(() => eventInput.classList.remove('ring-2', 'ring-red-400'), 500);
                return;
            }

            rawData.push({
                x: pendingPoint.x,
                y: pendingPoint.y,
                event: eventText
            });

            updateAndRenderChart();
            closeModal();
        }

        // 점 삭제 이벤트
        deleteBtn.addEventListener('click', function() {
            if (selectedIndexForDelete > -1) {
                rawData.splice(selectedIndexForDelete, 1);
                updateAndRenderChart();
                hideDeleteBtn();
            }
        });

        function hideDeleteBtn() {
            deleteBtn.classList.add('hidden');
            selectedIndexForDelete = -1;
        }

        function clearAll() {
            if(rawData.length === 0) return;
            if(confirm('모든 기록을 삭제하시겠습니까?')) {
                rawData = [];
                updateAndRenderChart();
                hideDeleteBtn();
            }
        }

        function updateAndRenderChart() {
            // X축(나이) 오름차순 정렬
            rawData.sort((a, b) => a.x - b.x);

            chartInstance.data.datasets[0].data = rawData;
            
            // Annotation(글상자) 다시 생성
            chartInstance.options.plugins.annotation.annotations = generateAnnotations();
            
            chartInstance.update();
        }

        // 글상자 생성 함수
        function generateAnnotations() {
            const annotations = {};
            rawData.forEach((item, index) => {
                const isPositive = item.y >= 0;
                annotations[`label_${index}`] = {
                    type: 'label',
                    xValue: item.x,
                    yValue: item.y,
                    // 양수는 위로, 음수는 아래로 띄우기
                    yAdjust: isPositive ? -40 : 40,
                    backgroundColor: 'rgba(255, 255, 255, 0.95)',
                    borderColor: '#2563eb',
                    borderWidth: 1.5,
                    borderRadius: 6,
                    content: [item.event],
                    font: { size: 12, weight: 'bold' },
                    color: '#1e293b',
                    padding: { top: 6, bottom: 6, left: 10, right: 10 },
                    callout: { 
                        display: true, 
                        borderColor: '#2563eb', 
                        borderWidth: 1.5,
                        margin: 0
                    },
                    drawTime: 'afterDatasetsDraw'
                };
            });
            return annotations;
        }

        // 화면 리사이즈 시 떠있는 삭제버튼 숨김
        window.addEventListener('resize', hideDeleteBtn);

        // 로드 완료 시 차트 초기화
        window.onload = initChart;

    </script>
</body>
</html>
