<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 인생 그래프</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">인생 그래프 그리기</h1>

        <!-- 데이터 입력 섹션 -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <input type="number" id="age" placeholder="나이 (예: 20)" class="border p-2 rounded w-full md:w-1/4 focus:outline-none focus:ring-2 focus:ring-blue-400">
            <input type="number" id="score" placeholder="행복도 (-10 ~ 10)" class="border p-2 rounded w-full md:w-1/4 focus:outline-none focus:ring-2 focus:ring-blue-400" min="-10" max="10">
            <input type="text" id="event" placeholder="주요 사건 (예: 대학 입학)" class="border p-2 rounded w-full md:w-2/4 focus:outline-none focus:ring-2 focus:ring-blue-400">
            <button onclick="addData()" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600 transition-colors font-semibold">추가</button>
        </div>

        <!-- 그래프 출력 섹션 -->
        <div class="relative h-96 w-full">
            <canvas id="lifeChart"></canvas>
        </div>
    </div>

    <script>
        let ages = [];
        let scores = [];
        let events = [];

        // 차트 초기화 설정
        const ctx = document.getElementById('lifeChart').getContext('2d');
        const lifeChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ages,
                datasets: [{
                    label: '행복도',
                    data: scores,
                    borderColor: 'rgb(59, 130, 246)',
                    backgroundColor: 'rgba(59, 130, 246, 0.2)',
                    borderWidth: 2,
                    pointRadius: 6,
                    pointHoverRadius: 8,
                    fill: true,
                    tension: 0.3 // 곡선 부드럽게
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        min: -10,
                        max: 10,
                        title: { display: true, text: '행복도 / 성취도' }
                    },
                    x: {
                        title: { display: true, text: '나이 (세)' }
                    }
                },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const index = context.dataIndex;
                                return `행복도: ${context.raw}점 | ${events[index]}`;
                            }
                        }
                    }
                }
            }
        });

        // 데이터 추가 및 차트 업데이트 함수
        function addData() {
            const ageInput = document.getElementById('age').value;
            const scoreInput = document.getElementById('score').value;
            const eventInput = document.getElementById('event').value;

            if (!ageInput || !scoreInput) {
                alert('나이와 행복도를 모두 입력해주세요.');
                return;
            }

            // 임시 배열에 데이터 저장
            ages.push(parseInt(ageInput));
            scores.push(parseInt(scoreInput));
            events.push(eventInput || '사건 없음');

            // 나이 순으로 데이터 오름차순 정렬
            const combined = ages.map((age, i) => ({ age: age, score: scores[i], event: events[i] }));
            combined.sort((a, b) => a.age - b.age);

            // 기존 배열 비우고 정렬된 데이터로 재할당
            ages.length = 0; scores.length = 0; events.length = 0;
            combined.forEach(item => {
                ages.push(item.age);
                scores.push(item.score);
                events.push(item.event);
            });

            // 차트 갱신
            lifeChart.update();

            // 입력창 초기화
            document.getElementById('age').value = '';
            document.getElementById('score').value = '';
            document.getElementById('event').value = '';
        }
    </script>
</body>
</html>
