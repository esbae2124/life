<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 인생 그래프 (직접 그리기)</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js Annotation 플러그인 로드 (글상자 표시용) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans">
    <div class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-2 text-center text-gray-800">나의 인생 그래프</h1>
        <p class="text-center text-gray-600 mb-6">나이별 행복도와 주요 사건을 입력하여 나만의 그래프를 만들어보세요.</p>

        <!-- 데이터 입력 섹션 -->
        <div class="bg-gray-50 p-4 rounded-lg mb-8 border border-gray-200">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">나이 (가로축)</label>
                    <input type="number" id="age" placeholder="예: 20" class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-400" min="0">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">행복/성취도 (-10 ~ 10)</label>
                    <input type="number" id="score" placeholder="예: 8" class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-400" min="-10" max="10">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">주요 사건 (글상자 내용)</label>
                    <input type="text" id="event" placeholder="예: 대학교 입학, 첫 취업 등" class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="resetData()" class="bg-gray-300 text-gray-800 px-5 py-2 rounded hover:bg-gray-400 transition-colors font-semibold">초기화</button>
                <button onclick="addData()" class="bg-blue-500 text-white px-5 py-2 rounded hover:bg-blue-600 transition-colors font-semibold">그래프에 점 추가</button>
            </div>
        </div>

        <!-- 그래프 출력 섹션 -->
        <div class="relative h-[500px] w-full border border-gray-100 rounded-xl p-2 bg-white">
            <canvas id="lifeChart"></canvas>
        </div>
        <p class="text-xs text-gray-400 mt-4 text-center">* 입력한 데이터는 브라우저를 새로고침하면 초기화됩니다.</p>
    </div>

    <script>
        // 데이터 저장 배열
        let rawData = [];

        // 차트 객체 전역 변수
        let lifeChart;

        // 초기 차트 설정 함수
        function initChart() {
            const ctx = document.getElementById('lifeChart').getContext('2d');
            
            lifeChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: '인생 곡선',
                        data: [], // [{x: 나이, y: 점수}] 형식으로 저장됨
                        borderColor: 'rgb(59, 130, 246)', // 파란색 선
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 3,
                        pointRadius: 6,
                        pointBackgroundColor: 'rgb(59, 130, 246)',
                        pointHoverRadius: 8,
                        fill: true,
                        tension: 0.2 // 약간 부드러운 곡선
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    // 마우스 호버 시 툴팁 비활성화 (글상자가 항상 떠있으므로 필요 없음)
                    plugins: {
                        tooltip: { enabled: false },
                        legend: { display: false }, // 범례 숨김
                        // annotation 플러그인 설정 (빈 상태로 초기화)
                        annotation: {
                            annotations: {}
                        }
                    },
                    scales: {
                        y: {
                            min: -11, // 글상자 공간 확보를 위해 약간 넓게 설정
                            max: 11,
                            title: { display: true, text: '행복 / 성취도', font: { weight: 'bold' } },
                            grid: { color: 'rgba(0,0,0,0.05)' }
                        },
                        x: {
                            type: 'linear', // 나이를 숫자형 가로축으로 설정
                            position: 'bottom',
                            min: 0,
                            suggestedMax: 30, // 초기 최대값 (데이터에 따라 늘어남)
                            title: { display: true, text: '나이 (세)', font: { weight: 'bold' } },
                            grid: { display: false } // 세로 그리드 숨김
                        }
                    }
                }
            });
        }

        // 사건 글상자(Annotation)를 생성하는 함수
        function generateAnnotations(dataList) {
            const annotations = {};
            
            dataList.forEach((item, index) => {
                // 사건 내용이 있을 때만 글상자 생성
                if (item.event && item.event.trim() !== '') {
                    annotations[`label${index}`] = {
                        type: 'label',
                        xValue: item.age,
                        yValue: item.score,
                        // 점 위에 글상자 배치 (yAdjust로 높이 조절)
                        yAdjust: item.score >= 0 ? -35 : 35, // 양수 점수는 위로, 음수 점수는 아래로
                        backgroundColor: 'rgba(255, 255, 255, 0.9)',
                        borderColor: 'rgb(59, 130, 246)',
                        borderWidth: 1,
                        borderRadius: 4,
                        content: [item.event], // 글상자 내용
                        font: { size: 12 },
                        padding: 6,
                        callout: { // 점과 글상자를 잇는 선
                            display: true,
                            borderColor: 'rgb(59, 130, 246)',
                            borderWidth: 1
                        }
                    };
                }
            });
            return annotations;
        }

        // [추가] 버튼 클릭 시 호출되는 함수
        function addData() {
            const ageInput = document.getElementById('age');
            const scoreInput = document.getElementById('score');
            const eventInput = document.getElementById('event');

            const age = parseInt(ageInput.value);
            const score = parseInt(scoreInput.value);
            const event = eventInput.value;

            // 필수 입력값 검증
            if (isNaN(age) || isNaN(score)) {
                alert('나이와 행복도를 정확히 입력해주세요.');
                return;
            }

            if (score < -10 || score > 10) {
                alert('행복도는 -10에서 10 사이로 입력해주세요.');
                return;
            }

            // 동일한 나이의 데이터가 있는지 확인
            const existingIndex = rawData.findIndex(item => item.age === age);
            if (existingIndex !== -1) {
                if(confirm(`${age}세 데이터가 이미 존재합니다. 수정하시겠습니까?`)) {
                    rawData[existingIndex] = { age, score, event };
                } else {
                    return;
                }
            } else {
                // 새로운 데이터 저장
                rawData.push({ age, score, event });
            }

            // 나이 순으로 데이터 정렬 (선 그래프를 그리기 위해 필수)
            rawData.sort((a, b) => a.age - b.age);

            // 1. 차트 데이터 업데이트 (x, y 좌표 형식)
            lifeChart.data.datasets[0].data = rawData.map(item => ({ x: item.age, y: item.score }));

            // 2. 글상자(Annotation) 업데이트
            lifeChart.options.plugins.annotation.annotations = generateAnnotations(rawData);

            // X축 최대값 동적 조절 (마지막 입력 나이 + 5년)
            const maxAge = rawData[rawData.length - 1].age;
            lifeChart.options.scales.x.max = Math.max(30, maxAge + 2);

            // 차트 반영
            lifeChart.update();

            // 입력창 초기화 및 포커스 이동
            ageInput.value = '';
            scoreInput.value = '';
            eventInput.value = '';
            ageInput.focus();
        }

        // [초기화] 버튼 클릭 시 호출
        function resetData() {
            if(confirm('모든 데이터를 삭제하고 그래프를 초기화하시겠습니까?')) {
                rawData = [];
                lifeChart.data.datasets[0].data = [];
                lifeChart.options.plugins.annotation.annotations = {};
                lifeChart.options.scales.x.max = 30;
                lifeChart.update();
            }
        }

        // 페이지 로드 시 차트 초기화
        window.onload = initChart;
    </script>
</body>
</html>
